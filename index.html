<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#efb979">
<title>عربية الفول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;800&display=swap">
<style>
/* Layout: a fixed 420x720 stage (awning, customers, counter, painted cart front) scaled to fit; the street scene stretches behind it to any width. Single daylight look. */
:root{
  --sky:#f6c98e;
  --paper:#fff3d6;
  --ink:#2b1a0f;
  --blue:#1d4f9c;
  --blue-d:#123672;
  --gold:#f2c230;
  --red:#d23a2a;
  --red-d:#9c2418;
  --green:#1f8a4c;
  --copper:#c5702c;
  --steel:#e4e9ed;
  --f-sign:"Aref Ruqaa","Traditional Arabic","Times New Roman",serif;
  --f-ui:"Cairo","Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:linear-gradient(#efb979,var(--sky) 40%,#fbe3bb);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden;overflow:clip}

/* HUD */
.hud{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.chip{background:var(--paper);border:2px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 rgba(43,26,15,.35);padding:4px 10px;line-height:1.25}
.day{display:flex;flex-direction:column;align-items:flex-start;min-width:84px}
.day b{font-weight:800;font-size:13px;white-space:nowrap}
.day .row{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.strikes{display:flex;gap:2px}
.strikes i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);background:transparent}
.strikes i.on{background:var(--red);border-color:var(--red-d)}
.goal{flex:1;min-width:0;max-width:460px;margin-inline:auto}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.goal-top b{font-size:17px;font-weight:800;color:var(--green)}
.bar{height:7px;border-radius:9px;background:rgba(43,26,15,.15);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#5cc06f);border-radius:9px;transition:width .3s}
.hbtn{flex:none;width:42px;height:42px;border-radius:12px;border:2px solid var(--ink);background:var(--paper);box-shadow:0 3px 0 rgba(43,26,15,.35);display:grid;place-items:center;cursor:pointer}
.hbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(43,26,15,.35)}
.hbtn svg{width:20px;height:20px}

/* world */
#play{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 62px);bottom:env(safe-area-inset-bottom,0px)}
#world{position:absolute;left:0;bottom:0;transform-origin:0 100%}
#bg{position:absolute;left:0;bottom:0;height:1278px;pointer-events:none}
#bg svg{display:block}
#tuk{position:absolute;top:192px;left:-140px;width:110px;height:80px;pointer-events:none}
#tuk.go{animation:tuk 13s linear}
@keyframes tuk{from{left:-140px}to{left:100%}}
#box{position:absolute;top:0;width:420px;height:798px}

.awning{position:absolute;top:0;left:-6px;width:432px;height:74px;z-index:4;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25))}
.pole{position:absolute;top:50px;width:7px;height:290px;border-radius:3px;background:linear-gradient(90deg,#8a5a1c,#f3cf7a,#a8701f);z-index:3}

/* customers */
#slots{position:absolute;top:70px;left:0;width:420px;height:262px;z-index:5}
.slot{position:absolute;top:0;width:140px;height:262px;border:0;background:none;padding:0;cursor:pointer}
.slot:not(.occupied){pointer-events:none}
.slot .person{position:absolute;bottom:-6px;left:50%;width:var(--pw,128px);height:calc(var(--pw,128px) * 1.25);margin-left:calc(var(--pw,128px) / -2);transition:transform .45s cubic-bezier(.2,.9,.3,1.2),opacity .45s}
.slot .person svg{width:100%;height:100%;display:block}
.slot .bubble{position:absolute;bottom:166px;left:5px;right:5px;min-height:88px;padding:6px 7px 8px;background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 rgba(43,26,15,.3);display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .3s,opacity .3s}
.slot .bubble::after{content:"";position:absolute;bottom:-9px;left:50%;width:14px;height:14px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.otxt{font-size:12px;font-weight:800;line-height:1.35;text-align:center;text-wrap:balance}
.oicons{display:flex;justify-content:center;gap:1px;height:28px}
.oicons svg{width:28px;height:28px}
.oicons .cont{margin-inline-end:3px;padding-inline-end:3px;border-inline-end:1.5px dashed rgba(43,26,15,.3)}
.pbar{width:100%;height:6px;border-radius:6px;background:rgba(43,26,15,.12);overflow:hidden;margin-top:auto}
.pbar i{display:block;height:100%;width:100%;border-radius:6px;background:#3aa557}
.react{display:none;font-size:13px;font-weight:800;line-height:1.45;text-align:center;margin:auto 0}
.bubble.reacting .order{display:none}
.bubble.reacting .react{display:block}
.order{display:contents}
.slot.enter .person{animation:rise .5s cubic-bezier(.2,.9,.3,1.2)}
.slot.enter .bubble{animation:pop .4s .25s both cubic-bezier(.2,.9,.3,1.3)}
@keyframes rise{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.slot.leaving .person{transform:translateX(-60px);opacity:0}
.slot.leaving .bubble{transform:scale(.6);opacity:0}
.slot.shake .bubble{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.slot.occupied:hover .bubble{border-color:var(--blue)}

/* counter */
.counter{position:absolute;top:330px;left:0;width:420px;height:232px;z-index:5;
  background:
    radial-gradient(circle at 10px 6px,#9aa5ad 2px,transparent 2.5px) 0 0/34px 100% repeat-x,
    linear-gradient(#c3ccd3,#f1f4f6 9%,#e1e7eb 60%,#cfd7dd);
  border-top:7px solid #8f9aa3;box-shadow:0 -4px 8px rgba(0,0,0,.18)}
.st{position:absolute;border:0;background:none;padding:0;cursor:pointer;display:block;transition:transform .12s}
.st:active{transform:scale(.94)}
.st svg{display:block;width:100%;height:100%;overflow:visible}
.lbl{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);font-size:11.5px;font-weight:800;white-space:nowrap;background:var(--ink);color:var(--paper);padding:0 8px;border-radius:8px;line-height:18px;pointer-events:none}
.st.locked{pointer-events:none}
.st.locked svg,.st.locked .lbl,.st.locked .fstat{filter:grayscale(1) opacity(.45)}
.lock{display:none;position:absolute;inset:20% 8%;place-items:center;font-size:12px;font-weight:800;background:rgba(43,26,15,.82);color:var(--paper);border-radius:10px;text-align:center;line-height:1.3;filter:none}
.locked-wrap .lock{display:grid}

#qidra{left:300px;top:-30px;width:112px;height:148px}
#qidra .steam{position:absolute;left:50%;top:6px;width:10px;height:30px;border-radius:50%;background:rgba(255,255,255,.7);filter:blur(4px);animation:steam 2.6s ease-out infinite;pointer-events:none}
#qidra .steam:nth-child(2){animation-delay:.9s;margin-left:-14px}
#qidra .steam:nth-child(3){animation-delay:1.7s;margin-left:10px}
@keyframes steam{0%{transform:translateY(10px) scale(.6);opacity:0}30%{opacity:.8}100%{transform:translateY(-40px) scale(1.6);opacity:0}}
.bounce{animation:bounce .25s}
@keyframes bounce{50%{transform:scale(1.08) translateY(-4px)}}

#pan{position:absolute;left:138px;top:6px;width:156px;height:118px}
#pan svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.piece{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;border:0;padding:0;cursor:pointer;transition:transform .12s}
.piece:active{transform:scale(.9)}
.piece.empty{background:rgba(255,236,170,.18);border:2px dashed rgba(255,240,200,.75)}
.piece.empty::after{content:"+";position:absolute;inset:0;display:grid;place-items:center;color:#fff6dc;font:800 20px/1 var(--f-ui)}
.piece.cook{background:var(--c);box-shadow:0 0 0 3px rgba(0,0,0,.25),inset 0 -4px 6px rgba(0,0,0,.25)}
.piece.cook::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(#fff6dc calc(var(--p)*1%),transparent 0);-webkit-mask:radial-gradient(circle,transparent 21px,#000 22px);mask:radial-gradient(circle,transparent 21px,#000 22px)}
.piece.ready{background:radial-gradient(circle at 35% 30%,#e7a24c,#a8601c 70%);box-shadow:0 0 0 2px #6e3a10,0 0 14px 4px rgba(255,214,120,.9);animation:ready .8s ease-in-out infinite alternate}
.piece.ready::after,.piece.cook::after{content:"";position:absolute;inset:8px;border-radius:50%;background:radial-gradient(#f6e6bf 1.2px,transparent 1.6px) 0 0/7px 7px;opacity:.9}
@keyframes ready{to{box-shadow:0 0 0 2px #6e3a10,0 0 20px 7px rgba(255,214,120,1)}}
.piece.burnt{background:radial-gradient(circle at 35% 30%,#4a2e1c,#1d120b 70%);box-shadow:0 0 0 2px #000}
.piece.burnt::after{content:"";position:absolute;left:50%;top:-14px;width:12px;height:22px;margin-left:-6px;border-radius:50%;background:rgba(70,70,70,.65);filter:blur(4px);animation:steam 1.6s ease-out infinite}
.piece.small{width:32px;height:32px;margin:-16px 0 0 -16px}
.piece.small.cook::before{-webkit-mask:radial-gradient(circle,transparent 18px,#000 19px);mask:radial-gradient(circle,transparent 18px,#000 19px)}

#fryer{left:12px;top:8px;width:118px;height:116px}
.fstat{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;font-size:12px;color:var(--paper);background:rgba(43,26,15,.78);padding:1px 8px;border-radius:8px;white-space:nowrap}
.fprog{position:absolute;left:18px;right:18px;top:40%;height:8px;border-radius:8px;background:rgba(0,0,0,.4);overflow:hidden;pointer-events:none}
.fprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f2c230,#ff9a3d)}
.badge{position:absolute;right:4px;top:6px;min-width:28px;height:28px;border-radius:14px;background:var(--red);color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.3);pointer-events:none}
#fryer .pile{opacity:0;transition:opacity .2s}
#fryer.ready .pile{opacity:1}
#fryer .bubbles circle{animation:bub 1s ease-in infinite;opacity:0}
#fryer.frying .bubbles circle{opacity:1}
@keyframes bub{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-8px);opacity:0}}

#bread{left:326px;top:132px;width:86px;height:92px}
#plates{left:246px;top:136px;width:76px;height:88px}
#eggs{left:12px;top:136px;width:84px;height:88px}

#asm{position:absolute;left:102px;top:128px;width:142px;height:98px;border-radius:12px;
  background:repeating-linear-gradient(92deg,rgba(0,0,0,.05) 0 3px,transparent 3px 11px),linear-gradient(#d9a566,#b98042);
  border:2px solid #7d5126;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 3px 0 rgba(0,0,0,.25);display:grid;place-items:center;overflow:visible}
.asm-empty{font-size:12px;font-weight:800;color:rgba(60,32,10,.75);text-align:center;line-height:1.5}
.asm-wrap{position:relative;width:132px;height:88px}
.asm-wrap > svg{position:absolute;left:0;bottom:2px;width:132px;height:70px}
.asm-items{position:absolute;left:0;right:0;top:4px;display:flex;justify-content:center}
.asm-items .ai{width:38px;height:38px;margin:0 -3px;animation:drop .25s cubic-bezier(.2,.9,.3,1.4)}
.asm-plate .asm-items{top:22px}
.asm-items svg{width:100%;height:100%}
@keyframes drop{from{transform:translateY(-18px) scale(1.2);opacity:0}}
#trash{position:absolute;left:-12px;top:-14px;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.3);z-index:2}
#trash svg{width:18px;height:18px}
#serveHint{position:absolute;right:-6px;top:-14px;font-size:11px;font-weight:800;background:var(--green);color:#fff;padding:2px 8px;border-radius:9px;white-space:nowrap;pointer-events:none;animation:nudge 1s ease-in-out infinite alternate}
@keyframes nudge{to{transform:translateY(-3px)}}

#toast{position:absolute;left:50%;top:-34px;transform:translate(-50%,8px);z-index:8;background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;padding:5px 14px;border-radius:12px;white-space:nowrap;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

.front{position:absolute;top:638px;left:0;width:420px;height:160px;z-index:6}
.front svg{display:block;width:100%;height:100%}

.float{position:absolute;z-index:9;font-weight:800;font-size:20px;color:var(--green);text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;animation:floatUp 1.1s ease-out forwards;white-space:nowrap;display:flex;align-items:center;gap:4px}
.float svg{width:20px;height:20px}
@keyframes floatUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-60px);opacity:0}}

/* overlay panels */
#overlay{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(43,26,15,.38);padding:16px max(16px,env(safe-area-inset-left,0px)) 16px max(16px,env(safe-area-inset-right,0px))}
.panel{width:min(370px,100%);max-height:100%;overflow:auto;background:var(--paper);border:4px solid var(--blue);border-radius:20px;box-shadow:0 0 0 4px var(--gold),0 0 0 8px var(--blue-d),0 22px 50px rgba(0,0,0,.35);padding:22px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
.sign{margin:0;font-family:var(--f-sign);font-weight:700;color:var(--red);line-height:1.15;text-wrap:balance}
.sign.xl{font-size:56px;color:var(--blue);text-shadow:2px 3px 0 var(--gold)}
.sign.lg{font-size:40px}
.sub{margin:-4px 0 0;font-family:var(--f-sign);font-size:22px;color:var(--ink)}
.txt{margin:0;font-size:14px;line-height:1.8;max-width:34ch}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;text-align:start;width:100%}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.65;background:rgba(29,79,156,.07);border-radius:12px;padding:8px 10px}
.steps li span{flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;margin-top:1px}
.goalbox{display:flex;align-items:center;gap:10px;background:#fff;border:2px dashed var(--green);border-radius:14px;padding:8px 16px;font-weight:800}
.goalbox b{font-size:24px;color:var(--green)}
.new{font-size:13px;font-weight:800;background:var(--gold);padding:4px 12px;border-radius:10px}
.btns{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:4px}
.btn{font-weight:800;font-size:18px;padding:11px 18px;border-radius:14px;border:2px solid var(--ink);cursor:pointer;background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-d);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red-d)}
.btn.alt{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(43,26,15,.35);font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stat{background:#fff;border-radius:12px;padding:8px 4px;border:1.5px solid rgba(43,26,15,.15);display:flex;flex-direction:column}
.stat span{font-size:11.5px;font-weight:600;opacity:.75}
.stat b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stars{display:flex;gap:6px}
.stars svg{width:44px;height:44px}
.stars svg.off path{fill:#e3d6bb;stroke:#bba985}
.stars svg.on{animation:pop .4s both cubic-bezier(.2,.9,.3,1.5)}
.wallet{font-size:14px;font-weight:600}
.wallet b{font-size:18px;color:var(--green)}
.shop{display:flex;flex-direction:column;gap:10px;width:100%}
.up{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;text-align:start;background:#fff;border-radius:14px;padding:10px 12px;border:1.5px solid rgba(43,26,15,.15)}
.up h3{margin:0;font-size:15px;font-weight:800}
.up p{margin:0;font-size:12px;opacity:.75;grid-column:1}
.lv{display:flex;gap:4px;grid-column:1}
.lv i{width:22px;height:6px;border-radius:4px;background:#e3d6bb}
.lv i.on{background:var(--green)}
.up .btn{grid-row:1/4;grid-column:2;font-size:14px;padding:8px 12px}

/* condiment shelf */
.shelf{position:absolute;top:562px;left:0;width:420px;height:76px;z-index:6;display:flex;justify-content:space-around;align-items:flex-end;padding:0 4px 6px;
  background:linear-gradient(#f4f6f7 0 3px,#9aa5ad 3px 6px,transparent 6px),linear-gradient(transparent 62px,#6e4520 62px,#8a5a2b 66px,#5a3818 76px),linear-gradient(#d9dfe3,#c4ccd2)}
.shelf .st{position:relative;width:76px;height:58px}
.shelf .st.fridge{width:108px;height:66px}
.shelf .st.fridge svg{height:64px;margin-top:0;filter:drop-shadow(0 0 7px rgba(140,210,255,.75))}
.fridge .fbtn{top:0;height:64px}
.fridge .glow{animation:fridgeHum 2.4s ease-in-out infinite}
@keyframes fridgeHum{50%{opacity:.75}}
.shelf .st svg{height:50px}
.tag{position:absolute;top:-11px;right:-6px;background:var(--red);color:#fff;font-size:11px;font-weight:800;line-height:18px;padding:0 8px;border-radius:9px;border:1.5px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.25);z-index:1}
.tag.calm{background:var(--green)}
.oicons.many{height:22px}
.oicons.many svg{width:21px;height:21px}
.asm-items.many .ai{width:27px;height:27px;margin:0 -1px}
.asm-sandwich .asm-items.many{top:10px}
.asm-plate .asm-items.many{top:28px}

#slots.tight .otxt{font-size:11px}
#slots.tight .oicons svg{width:22px;height:22px}
#pan{transform-origin:50% 50%}
/* players & save code */
input,textarea{-webkit-user-select:text;user-select:text}
.whoform{display:flex;gap:8px;width:100%}
.field{flex:1;min-width:0;font:600 16px var(--f-ui);padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
.field:focus{outline:3px solid var(--blue);outline-offset:1px}
textarea.field{width:100%;min-height:76px;resize:vertical;font:600 12px/1.5 ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:left;word-break:break-all}
.whoform .btn{flex:none}
.who{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.who .btn{font-size:16px;padding:9px 16px}
.hint{font-size:12.5px;line-height:1.7;margin:0;opacity:.8;max-width:34ch}
.hello{margin:-6px 0 0;font-size:15px;font-weight:800;color:var(--green)}
.savebox{width:100%;display:flex;flex-direction:column;gap:8px;text-align:start}
.savebox h3{margin:0;font-size:14px;font-weight:800}
.msg{font-size:13px;font-weight:800;min-height:1.4em;margin:0;color:var(--green)}
.msg.err{color:var(--red)}
.row2{display:flex;gap:8px;width:100%}
.row2 .btn{flex:1;font-size:15px}
/* fridge, tables, radio */
.fbtn{position:absolute;top:0;height:50px;width:50%;border:0;background:none;padding:0;cursor:pointer;border-radius:8px}
.fbtn:active{background:rgba(255,255,255,.35)}
#sodaBtn{left:0}#waterBtn{right:0}
.tbl{position:absolute;left:4px;right:4px;bottom:-2px;height:46px;pointer-events:none;z-index:1}
.tbl svg{width:100%;height:100%;display:block}
.tbl .food{opacity:0;transition:opacity .3s}
.slot.eating .tbl .food{opacity:1}
.slot.table .person{bottom:-24px}

  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.max(0, Math.min(255, Math.round(c + (amt < 0 ? c : 255 - c) * amt)));
  return '#' + [n >> 16, n >> 8 & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
}

function update(dt){
  const r = st.run;
  r.t += dt;
  r.slots.forEach((s, i) => { if (!s.c && s.cool <= 0 && r.seats.some(Boolean)) seatToSlot(i); });
  if (r.t < r.len) {
    r.next -= dt;
    if (r.next <= 0) {
      const free = r.slots.map((s, i) => !s.c && s.cool <= 0 ? i : -1).filter(i => i >= 0);
      if (free.length) { spawn(pick(free)); r.next = r.interval * (.75 + Math.random() * .5); }
      else if (seatCustomer()) r.next = r.interval * (.75 + Math.random() * .5);
      else r.next = .5;
    }
  }
  tickSeats(dt);
  r.slots.forEach((s, i) => {
    if (s.cool > 0) s.cool -= dt;
    const c = s.c; if (!c) return;
    if (c.react > 0) { c.react -= dt; if (c.react <= 0 && c.state === 'wait') c.bub.classList.remove('reacting'); }
    if (c.state !== 'wait') return;
    c.left -= dt;
    const f = Math.max(0, c.left / c.max);

    </div>`, 'wide');
  ov.querySelectorAll('[data-loc]').forEach(b => b.addEventListener('click', () => showMap(+b.dataset.loc)));
  ov.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => { const g = +b.dataset.g; if (levelOpen(g)) { audio(); showIntro(g); } }));
  on('shopBtn', () => showShop(() => showMap(li)));
  on('mktBtn', () => showMarket(() => showMap(li)));
  on('menuBtn', showTitle);
  const nb = ov.querySelector('.lvcard.next') || ov.querySelector('.lvcard:not(.shut)');
  if (nb) nb.focus({ preventScroll:true });
}
function showIntro(g){
  st.screen = 'intro'; st.cur = g; st.run = null; applyLoc(); renderLocks(); updateHud();
  const L = LV(g);
  const news = NEWS[g] || '';
  const steps = g === 0 ? `<ol class="steps">
      <li><span>١</span>اضغط على العيش البلدي عشان تبدأ ساندوتش.</li>
      <li><span>٢</span>الفول من القدرة على طول. الطعمية حط عجينتها في الطاسة، ولما تحمر وتنوّر اضغط عليها.</li>
      <li><span>٣</span>اضغط على الزبون عشان تسلّمه الطلب، وكل ما تسرع البقشيش يزيد.</li>
      <li><span>٤</span>خلي بالك، الطعمية لو استنت كتير هتتحرق.</li>
    </ol>` : g === 1 ? '<ol class="steps"><li><span>!</span>الإضافات زي الطحينة على الرف قدام العربية. حطها مع الأكل.</li><li><span>!</span>الزبون اللي عليه "مستعجل" صبره قليل بس بقشيشه الضعف. والراجل الكبير "على مهله".</li></ol>' : '';
  showPanel(`
    <span class="locchip">${L.loc.name}</span>
    <h2 class="sign lg">${L.boss ? 'يوم الزحمة' : 'اليوم ' + ar(L.n + 1)}</h2>
    ${news ? `<span class="new">${news}</span>` : ''}
    ${L.boss ? '<span class="new">الزباين هييجوا أسرع والهدف أكبر</span>' : ''}
    ${L.n === 0 && L.li > 0 ? `<p class="txt">${L.loc.desc}</p>` : ''}
    <div class="goalbox">الهدف <b>${ar(L.target)}</b> جنيه</div>
    ${steps}
    ${g > 0 ? '<p class="txt">لو ٣ زباين مشيوا زعلانين، اليوم يقفل بدري.</p>' : ''}
    ${lowStock(L).length ? `<div class="warn">البضاعة قربت تخلص: ${lowStock(L).join('، ')}. هات من السوق قبل ما تفتح.</div>` : ''}
    <div class="btns"><button class="btn" id="openBtn" type="button">${L.loc.rest ? 'افتح المطعم' : 'افتح العربية'}</button><button class="btn alt" id="mktBtn" type="button">السوق</button><button class="btn ghost" id="mapBtn" type="button">الخريطة</button></div>`);
  on('mktBtn', () => showMarket(() => showIntro(g)));
  on('openBtn', () => startDay(g));
  on('mapBtn', () => showMap(L.li));
}
function startDay(g){
  hidePanel();
  st.cur = g; applyLoc();
  const L = LV(g);
  st.run = { lv:L, t:0, len:L.len, interval:L.interval, earned:0, served:0, angry:0, next:1.2, target:L.target,
    slots:slotEls.map(() => ({ c:null, cool:0 })), seats: Array(seatsN()).fill(null),
    pan: Array(Math.min(5, 3 + st.save.up.pan + (isRest() ? 1 : 0))).fill(null),
    fry:{ state:'idle', t:0, stock:0 }, asm:{ type:null, items:[] } };
  slotEls.forEach((el, i) => resetSlot(i)); renderStock(); renderSeats();
  lastStrikes = -1;
  buildPan(st.run.pan.length); renderPan(); renderFry(); renderAsm(); renderLocks(); updateHud();
  st.screen = 'play'; st.paused = false; $('#pauseBtn').hidden = false;
}
function endDay(reason){
  const r = st.run; if (!r) return;
  st.screen = 'end';
  const L = r.lv, passed = reason === 'time' && r.earned >= r.target;
  const s = !passed ? 0 : r.earned >= r.target * 1.5 && r.angry <= 1 ? 3 : r.earned >= r.target * 1.25 ? 2 : 1;
  const before = stars(L.g);
  if (passed) { st.save.stars[L.g] = Math.max(before, s); sfx.win(); } else sfx.angry();
  persist();
  const next = L.g + 1, nextOpen = passed && levelOpen(next);
  let note = '';
  if (passed && next >= LEVELS) note = 'خلّصت كل الأماكن! عم صابر بقى أشهر عربية فول في مصر.';
  else if (passed && L.boss && nextOpen) note = `فتحت مكان جديد: ${LOCS[L.li + 1].name}!`;
  else if (passed && L.boss && !nextOpen) { const nl = LOCS[L.li + 1]; note = nl.rest ? `جاهز تفتح مطعم بجد؟ افتح فرع ${nl.name} من "طوّر شغلك" بـ ${ar(nl.cost)} جنيه.` : `عشان تروح ${nl.name} محتاج ${CART[nl.cart].name}. كبّر العربية من "طوّر شغلك".`; }
  const head = passed ? [L.boss ? 'عدّيت يوم الزحمة!' : 'يوم حلو يا معلم!', note || `${L.loc.short}: اليوم ${ar(L.n + 1)} خلص والعربية كسبت.`]
    : reason === 'angry' ? ['اليوم قفل بدري', '٣ زباين مشيوا زعلانين. حاول تسرع شوية.']
    : ['قرّبت يا معلم', `الإيراد ما وصلش للهدف (${ar(r.target)} جنيه). جرّب تاني.`];
  showPanel(`
    <h2 class="sign lg">${head[0]}</h2>
    ${passed ? `<div class="stars">${[0, 1, 2].map(i => STAR.replace('<svg', `<svg class="${i < s ? 'on' : 'off'}" style="animation-delay:${i * .15}s"`)).join('')}</div>` : ''}
    <p class="txt">${head[1]}</p>
    <div class="stats">
      <div class="stat"><span>الإيراد</span><b>${ar(r.earned)}</b></div>
      <div class="stat"><span>زباين مبسوطين</span><b>${ar(r.served)}</b></div>
      <div class="stat"><span>زعلانين</span><b>${ar(r.angry)}</b></div>
    </div>
    <p class="wallet">في الدرج <b>${ar(st.save.wallet)}</b> جنيه</p>
    <div class="btns">
      ${nextOpen ? '<button class="btn" id="nextBtn" type="button">الليفل اللي بعده</button>' : ''}
      ${!passed ? '<button class="btn" id="retryBtn" type="button">جرّب تاني</button>' : ''}
      <div class="row2"><button class="btn alt" id="shopBtn" type="button">طوّر شغلك</button><button class="btn alt" id="mktBtn" type="button">السوق</button></div>
      <button class="btn ghost" id="mapBtn" type="button">الخريطة</button>
    </div>`);
  on('nextBtn', () => showIntro(next));
  on('retryBtn', () => showIntro(L.g));
  on('shopBtn', () => showShop(() => showMap(passed && L.boss && next < LEVELS ? L.li + 1 : L.li)));
  on('mapBtn', () => showMap(nextOpen ? LV(next).li : L.li));
  on('mktBtn', () => showMarket(() => showMap(nextOpen ? LV(next).li : L.li)));
}
function marketItems(){
  const stage = Math.max(LV(frontier()).unlock, LV(st.cur).unlock);
  return MARKET.filter(m => m.fridge ? st.save.up.fridge : stage >= m.st);
}
function lowStock(L){
  const stage = L.unlock;
  return MARKET.filter(m => (m.fridge ? st.save.up.fridge : stage >= m.st) && (st.save.stock[m.k] || 0) < 8).map(m => m.name);
}
function showMarket(back){
  const items = marketItems();
  const topUp = items.reduce((sum, m) => { const need = Math.max(0, 20 - (st.save.stock[m.k] || 0)); return sum + Math.ceil(need / m.pack) * m.price; }, 0);
  const broke = st.save.wallet < 40 && ['bread','foul','taameya'].every(k => (st.save.stock[k] || 0) < 3);
  showPanel(`
    <h2 class="sign lg">السوق</h2>
    <p class="wallet">في الدرج <b>${ar(st.save.wallet)}</b> جنيه</p>
    <p class="hint">كل حاجة بتستخدمها في الطلبات بتخلص من البضاعة. اشتري قبل ما تفتح، والفلوس بتتخصم من الإيراد.</p>
    ${topUp > 0 ? `<button class="btn" id="topUpBtn" type="button" ${st.save.wallet < topUp ? 'disabled' : ''}>كمّل كل حاجة لحد ٢٠ بـ ${ar(topUp)} جنيه</button>` : '<p class="msg">البضاعة كلها كفاية.</p>'}
    ${broke ? '<button class="btn alt" id="credit" type="button">خد بضاعة على النوتة (مجاناً المرة دي)</button>' : ''}
    <div class="mkt">${items.map(m => { const n = st.save.stock[m.k] || 0; return `<div class="mrow">${ICON[m.icon]}<div><b>${m.name}</b><small class="${n < 5 ? 'low' : ''}">عندك ${n ? ar(n) : 'ولا حاجة'}</small></div><button class="btn" type="button" data-buy="${m.k}" ${st.save.wallet < m.price ? 'disabled' : ''}>${ar(m.pack)} بـ ${ar(m.price)} ج</button></div>`; }).join('')}</div>
    <div class="btns"><button class="btn ghost" id="backBtn" type="button">رجوع</button></div>`);
  ov.querySelectorAll('[data-buy]').forEach(b => b.addEventListener('click', () => {
    const m = MARKET.find(x => x.k === b.dataset.buy);
    if (!m || st.save.wallet < m.price) return;
    st.save.wallet -= m.price; st.save.stock[m.k] = (st.save.stock[m.k] || 0) + m.pack; persist(); renderStock(); sfx.coin(); showMarket(back);
  }));
  const tb = $('#topUpBtn');
  if (tb) tb.addEventListener('click', () => {
    if (st.save.wallet < topUp) return;
    items.forEach(m => { const need = Math.max(0, 20 - (st.save.stock[m.k] || 0)); const packs = Math.ceil(need / m.pack); st.save.stock[m.k] = (st.save.stock[m.k] || 0) + packs * m.pack; });
    st.save.wallet -= topUp; persist(); renderStock(); sfx.coin(); showMarket(back);
  });
  const cr = $('#credit');
  if (cr) cr.addEventListener('click', () => { ['bread','foul','taameya'].forEach(k => { st.save.stock[k] = (st.save.stock[k] || 0) + 10; }); persist(); renderStock(); sfx.coin(); showMarket(back); });
  on('backBtn', back);
}
function showShop(back){
  const t = st.save.up.cart, nx = CART[t + 1];
  const cartRow = nx
    ? `<div class="up cartup"><h3>كبّر العربية: ${nx.name}</h3><p>${nx.perks}</p><div class="lv">${CART.slice(1).map((_, i) => `<i class="${i < t ? 'on' : ''}"></i>`).join('')}</div>
        <button class="btn" type="button" id="cartBuy" ${st.save.wallet < nx.cost ? 'disabled' : ''}>${ar(nx.cost)} جنيه</button></div>`
    : `<div class="up cartup"><h3>${cart().name}</h3><p>عربيتك وصلت لأكبر حجم.</p></div>`;
  const branchRows = LOCS.filter(l => l.rest).map(l => st.save.branches[l.key]
    ? `<div class="up branch"><h3>فرع ${l.name}</h3><p>الفرع شغال. روحله من الخريطة.</p></div>`
    : `<div class="up branch"><h3>افتح مطعم في ${l.name}</h3><p>مطعم كبير فيه ترابيزتين وكاونتر واسع، والزباين هناك بيدفعوا أكتر بكتير.</p><button class="btn" type="button" data-branch="${l.key}" ${st.save.wallet < l.cost ? 'disabled' : ''}>${ar(l.cost)} جنيه</button></div>`).join('');
  const rows = Object.entries(UPG).map(([k, u]) => {
    const lv = st.save.up[k], maxed = lv >= u.costs.length, cost = u.costs[lv];
    return `<div class="up"><h3>${u.name}</h3><p>${u.desc}</p><div class="lv">${u.costs.map((_, i) => `<i class="${i < lv ? 'on' : ''}"></i>`).join('')}</div>
      <button class="btn" type="button" data-k="${k}" ${maxed || st.save.wallet < cost ? 'disabled' : ''}>${maxed ? 'كامل' : ar(cost) + ' جنيه'}</button></div>`;
  }).join('');
  showPanel(`
    <h2 class="sign lg">طوّر شغلك</h2>
    <p class="wallet">في الدرج <b>${ar(st.save.wallet)}</b> جنيه، وعربيتك دلوقتي: <b>${cart().name}</b></p>
    <div class="shop">${cartRow}${branchRows}${rows}</div>
    <div class="btns"><button class="btn alt" id="backBtn" type="button">رجوع</button></div>`);
  const cb = $('#cartBuy');
  if (cb) cb.addEventListener('click', () => {
    if (!nx || st.save.wallet < nx.cost) return;
    st.save.wallet -= nx.cost; st.save.up.cart++; persist(); applyCart(); sfx.win(); showShop(back);
  });
  ov.querySelectorAll('[data-branch]').forEach(b => b.addEventListener('click', () => {
    const l = LOCS.find(x => x.key === b.dataset.branch);
    if (!l || st.save.branches[l.key] || st.save.wallet < l.cost) return;
    st.save.wallet -= l.cost; st.save.branches[l.key] = true; persist(); sfx.win(); showShop(back);
  }));
  ov.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k, cost = UPG[k].costs[st.save.up[k]];
    if (st.save.wallet < cost) return;
    st.save.wallet -= cost; st.save.up[k]++; persist(); sfx.coin(); applyCart(); renderLocks(); if (st.screen !== 'play') slotEls.forEach((el, i) => { if (!el.classList.contains('occupied')) resetSlot(i); }); showShop(back);
  }));
  on('backBtn', back);
}
function pause(){
  if (st.screen !== 'play' || st.paused) return;
  st.paused = true;
  showPanel(`<h2 class="sign lg">استراحة شاي</h2><p class="txt">العربية مستنياك، والزباين واقفين مكانهم.</p>
    <div class="btns"><button class="btn" id="resumeBtn" type="button">كمّل الشغل</button><button class="btn alt" id="mktBtn" type="button">السوق</button><button class="btn ghost" id="quitBtn" type="button">القائمة</button></div>`);
  on('resumeBtn', resume);
  on('mktBtn', () => showMarket(() => { st.paused = false; pause(); }));
  on('quitBtn', () => { st.paused = false; persist(); showMap(LV(st.cur).li); });
}
function resume(){ if (!st.paused) return; st.paused = false; hidePanel(); last = performance.now(); }
$('#pauseBtn').addEventListener('click', pause);
renderStock();
$('#muteBtn').addEventListener('click', () => { st.muted = !st.muted; store.set('ful.muted', st.muted); syncMute(); if (!st.muted) tone(880, .1, 'sine', .06); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP') { if (st.paused) resume(); else pause(); }
});

/* ================= layout ================= */
const play = $('#play'), world = $('#world'), bg = $('#bg');
let lastW = 0;
function layout(){
  const pr = play.getBoundingClientRect();
  if (!pr.width || !pr.height) return;
  const s = Math.min(pr.width / (LW + 2 * wingW()), pr.height / LH);
  const W = Math.ceil(pr.width / s) + 2;
  world.style.width = W + 'px'; world.style.height = LH + 'px';
  world.style.transform = `scale(${s})`;
  box.style.left = Math.round((W - LW) / 2) + 'px';
  bg.style.width = W + 'px';
  if (Math.abs(W - lastW) > 3) { bg.innerHTML = buildStreet(W, curLocKey); lastW = W; }
}
if (window.ResizeObserver) new ResizeObserver(layout).observe(play);
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 250));

const appEl = $('#app');
appEl.addEventListener('scroll', () => { if (appEl.scrollLeft || appEl.scrollTop) { appEl.scrollLeft = 0; appEl.scrollTop = 0; } });
layout(); syncMute(); showTitle(); cloudInit();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { lastW = 0; layout(); });
requestAnimationFrame(frame);
})();
</script>
